<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{groomName}} &amp; {{brideName}} — Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-wedding-date="{{weddingDate}}">
  <div class="patrika-card">
    <div class="golden-border">
      <div class="shloka-banner">॥ श्री गणेशाय नमः ॥</div>

      <div class="couple-title">{{groomName}}</div>
      <div class="weds-symbol">weds</div>
      <div class="couple-title">{{brideName}}</div>

      <div class="date-badge">
        📅 {{weddingDate}}
      </div>

      <!-- Live Countdown -->
      <div class="countdown-container">
        <div class="countdown-box">
          <span class="countdown-num" id="cd-days">00</span>
          <span class="countdown-label">Days</span>
        </div>
        <div class="countdown-box">
          <span class="countdown-num" id="cd-hours">00</span>
          <span class="countdown-label">Hours</span>
        </div>
        <div class="countdown-box">
          <span class="countdown-num" id="cd-minutes">00</span>
          <span class="countdown-label">Mins</span>
        </div>
        <div class="countdown-box">
          <span class="countdown-num" id="cd-seconds">00</span>
          <span class="countdown-label">Secs</span>
        </div>
      </div>

      <!-- Venue & Map -->
      <div class="venue-section">
        <div class="venue-title">Wedding Ceremony &amp; Venue</div>
        <div class="venue-address">
          {{venue}}, {{city}}
        </div>
        <a href="https://www.google.com/maps/search/?api=1&query={{venue}}+{{city}}" target="_blank" rel="noopener noreferrer" class="btn-map">
          📍 View on Google Maps
        </a>
      </div>

      <!-- Story / Welcome -->
      <div class="story-text">
        "{{story}}"
      </div>

      <div class="story-text" style="font-style: normal; font-size: 13px; opacity: 0.9;">
        {{familyMessage}}
      </div>

      <div class="footer-blessing">
        ✨ VivahVaani Digital Patrika • Heartiest Blessings ✨
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
